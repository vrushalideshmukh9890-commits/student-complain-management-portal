{% extends "base.html" %}

{% block title %}Student Login - Campus Helpdesk{% endblock %}

{% block content %}
<div class="glass-panel" style="max-width: 450px; margin: 4rem auto;">
    <h2 class="text-center mb-2">Student Login 🎓</h2>
    
    {% if error %}
        <div class="toast toast-error show" style="position: static; transform: none; margin-bottom: 1.5rem; width: 100%;">
            <div class="toast-content">{{ error }}</div>
        </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="email" aria-autocomplete="list">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="student@example.com">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    
    <div class="text-center mt-2">
        <p>Don't have an account? <a href="{{ url_for('student_signup') }}">Sign up here</a></p>
        <p class="mt-1">Are you an HOD? <a href="{{ url_for('hod_login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
